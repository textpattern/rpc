	<p>When enabled, this setting allows <span class="caps">PHP</span> code within page and form templates.</p>
	<p><span class="caps">PHP</span> code must have opening and closing <span class="caps">PHP</span> tags omitted, and also be enclosed within <a href="https://docs.textpattern.com/tags/php" target="_blank">&lt;txp:php&gt; tags</a>.</p>
